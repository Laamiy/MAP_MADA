[[providers.layers]]
name               = "roads_low_name"
geometry_fieldname = "geom"
id_fieldname       = "osm_id"
geometry_type      = "linestring"
sql = """
SELECT osm_id,
       name,  -- Keep names for regular roads
       CASE 
         WHEN ref ~* '^N\\s*\\d+' THEN 'RN' || regexp_replace(ref, '^N\\s*', '')  -- N7 -> RN7, N 44 -> RN44
         ELSE NULL 
       END AS ref,  -- Only return ref if it's a national route (N+number)
       highway,
       ST_AsMVTGeom(
           COALESCE(
             CASE WHEN !ZOOM! < 5 THEN ST_Simplify(ST_CollectionExtract((way),2),200)
                  ELSE ST_CollectionExtract((way),2)
             END, (way)
           ), !BBOX!
       ) AS geom
FROM planet_osm_line
WHERE highway IS NOT NULL
  AND way && !BBOX!
  AND (name IS NOT NULL OR (ref IS NOT NULL AND ref ~* '^N\\s*\\d+'))  -- Has either a name OR is a national route
ORDER BY highway
LIMIT 1500

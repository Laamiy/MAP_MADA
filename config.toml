##########################################
# ONE map: madagascar (world + local)
##########################################

[webserver]
port = ":8086"
read_timeout  = "300s"
write_timeout = "300s"
dont_render_empty_tiles = true
[[providers]]
name = "osm"
type = "mvt_postgis"
uri  = "postgresql://renderer:renderer@localhost:5432/gis?sslmode=disable"
srid = 3857
max_connections = 120
sql_query_timeout = "300s"
# gzip = true
# -------------------------------------------------
# WORLD LAYERS – index + bbox first, km-level simplification
# -------------------------------------------------

[[providers.layers]]
name = "world_ocean_110m"
geometry_fieldname = "geom"
id_fieldname = "gid"
geometry_type = "polygon"
sql = """
SELECT gid, 'ocean' AS name,
       ST_AsMVTGeom(
         ST_Simplify(
           ST_Transform(geom, 3857), 
           CASE 
             WHEN !ZOOM! <= 2 THEN 10000
             WHEN !ZOOM! <= 4 THEN 5000
             WHEN !ZOOM! <= 6 THEN 2000
             ELSE 1000
           END
         ), 
         !BBOX!
       ) AS geom
FROM ne_110m_ocean
WHERE ST_Transform(geom, 3857) && !BBOX!
  AND !ZOOM! <= 10
"""

[[providers.layers]]
name = "world_countries_110m"
geometry_fieldname = "geom"
id_fieldname = "gid"
geometry_type = "polygon"
sql = """
SELECT gid, name, name_en,
       ST_AsMVTGeom(
         ST_Simplify(
           ST_Transform(geom, 3857), 
           CASE 
             WHEN !ZOOM! = 0 THEN 50000
             WHEN !ZOOM! = 1 THEN 20000
             WHEN !ZOOM! = 2 THEN 10000
             WHEN !ZOOM! = 3 THEN 5000
             ELSE 2000
           END
         ), 
         !BBOX!
       ) AS geom
FROM ne_110m_admin_0_countries
WHERE ST_Transform(geom, 3857) && !BBOX!
  AND !ZOOM! BETWEEN 0 AND 4
"""

[[providers.layers]]
name = "world_countries_50m"
geometry_fieldname = "geom"
id_fieldname = "gid"
geometry_type = "polygon"
sql = """
SELECT gid, name, name_en,
       ST_AsMVTGeom(
         ST_Simplify(
           ST_Transform(geom, 3857), 
           CASE 
             WHEN !ZOOM! <= 4  THEN 5000   -- Very smooth at z4
             WHEN !ZOOM! <= 6  THEN 2000   -- Less smooth at z5-6
             WHEN !ZOOM! <= 8  THEN 1000   -- More detail at z7-8
             WHEN !ZOOM! <= 11 THEN 500    -- Good detail at z9-10
             ELSE 5                     -- Very fine at z13+
           END
         ), 
         !BBOX!
       ) AS geom
FROM ne_10m_admin_0_countries
WHERE ST_Transform(geom, 3857) && !BBOX!
  AND !ZOOM! BETWEEN 3 AND 11
"""

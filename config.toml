[[providers.layers]]
name               = "road_arrows"
geometry_fieldname = "geom"
id_fieldname       = "osm_id"
geometry_type      = "linestring"
sql = """
SELECT osm_id,
       highway,
       oneway,
       ST_AsMVTGeom(
         ST_Transform(
           CASE WHEN oneway = '-1' THEN ST_Reverse(way)  -- make digitising = forward
                ELSE way
           END,
           3857
         ),
         !BBOX!
       ) AS geom
FROM planet_osm_line
WHERE highway IN ('motorway','trunk','primary','secondary','tertiary')
  AND oneway IN ('yes','-1')
  AND way && !BBOX!
LIMIT 400
"""


[[providers.layers]]
name = "pois"
geometry_fieldname = "geom"
id_fieldname = "osm_id"
geometry_type = "point"
sql = """
SELECT
  osm_id,
  name,
  amenity,
  tourism,
  shop,
  man_made,
  COALESCE(
    CASE
      WHEN amenity IN ('restaurant','cafe','fast_food','bar','pub','food_court','ice_cream')        THEN 'food'
      WHEN amenity IN ('fuel','charging_station')                                                   THEN 'fuel'
      WHEN amenity IN ('hospital','clinic','dentist','doctors','pharmacy','health_post','health_facility','veterinary') THEN 'health'
WHEN amenity IN ('bank','atm','bureau_de_change','money_transfer','mobile_money_agent','payment_centre') THEN 'bank'
      WHEN amenity IN ('school','college','university','kindergarten','language_school','music_school','training','prep_school','primaire','research_institute') THEN 'education'
      WHEN amenity IN ('post_office','post_box','parcel_locker')                                    THEN 'post'
      WHEN shop    IN ('supermarket','convenience','greengrocer','butcher','bakery','department_store','mall') THEN 'grocery'
      WHEN shop    IN ('clothes','shoes','jewelry','gift','books','marketplace')                   THEN 'shop'
      WHEN tourism IN ('hotel','guest_house','hostel','motel','love_hotel','alpine_hut')            THEN 'lodging'
      WHEN tourism IN ('museum','zoo','theme_park','gallery','arts_centre','theatre','music_venue','events_venue') THEN 'culture'
      WHEN tourism IN ('information','viewpoint','attraction')                                     THEN 'tourism'
      WHEN amenity IN ('place_of_worship') OR religion IS NOT NULL                                 THEN 'worship'
      WHEN amenity IN ('police','fire_station','ranger_station')                                   THEN 'public'
      WHEN amenity IN ('parking','motorcycle_parking','bicycle_parking')                           THEN 'parking'
      WHEN amenity IN ('toilets','public_bath','shower','drinking_water','water_point')            THEN 'sanitary'
      WHEN amenity IN ('parking','motorcycle_parking','bicycle_parking')                           THEN 'parking'
      WHEN amenity IN ('waste_basket','waste_disposal','recycling','grit_bin')                     THEN 'waste'
      WHEN leisure  IN ('playground','pitch','sports_centre','stadium')                            THEN 'sport'
      WHEN amenity IN ('ferry_terminal') OR route='ferry'                                          THEN 'ferry'
      WHEN amenity IN ('taxi','bus_station','bus_stop','driver_training','driving_school')         THEN 'transport'
      WHEN amenity IN ('telephone','internet_cafe','radio station')                                THEN 'communication'
      WHEN amenity IN ('library','public_bookcase','mobile_library')                               THEN 'library'
      WHEN amenity IN ('courthouse','prison')                                                      THEN 'justice'
      WHEN amenity IN ('townhall','public_building','social_centre','community_centre','conference_centre') THEN 'civic'
      WHEN amenity IN ('casino','gambling')                                                        THEN 'gambling'
      WHEN amenity IN ('fountain','bench','shelter','smoking_area','weighbridge','loading_dock')    THEN 'amenity'
      WHEN shop       IS NOT NULL                                                                   THEN 'shop'
      WHEN tourism    IS NOT NULL                                                                   THEN 'tourism'
      WHEN man_made   IS NOT NULL                                                                   THEN 'industrial'
    END,
    'dot'   -- fallback
  ) AS icon_class,
  /* ---------------------------------- */
  ST_AsMVTGeom(way, !BBOX!) AS geom
FROM planet_osm_point
WHERE (name IS NOT NULL OR amenity IS NOT NULL OR tourism IS NOT NULL OR
       shop IS NOT NULL OR man_made IS NOT NULL)
  AND NOT ST_IsEmpty(way)
  AND way && !BBOX!
ORDER BY name
LIMIT 1000
"""

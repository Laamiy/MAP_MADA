# 2.  MADAGASCAR DETAIL (OSM)        – zoom 6-20
# -------------------------------------------------
# water
[[providers.layers]]
name = "water_polygons"
geometry_fieldname = "geom"
id_fieldname = "osm_id"
geometry_type = "polygon"
sql = """
SELECT osm_id, water, "natural",
       ST_AsMVTGeom(
           COALESCE(
             CASE WHEN !ZOOM! < 9 THEN ST_Simplify(ST_CollectionExtract((way),3),3)
                  ELSE ST_CollectionExtract((way),3)
             END,
             (way)
           ), !BBOX!
       ) AS geom
FROM planet_osm_polygon
WHERE (water IS NOT NULL OR "natural" = 'water')
  AND NOT ST_IsEmpty(way)
  AND way && !BBOX!
LIMIT CASE 
    WHEN !ZOOM! <= 8 THEN 300
    WHEN !ZOOM! <= 12 THEN 600
    ELSE 2000
END
"""

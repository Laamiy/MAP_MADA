# 1. minor roads (tracks, footways, alleys, paths, cycleways …)
[[providers.layers]]
name = "minor_roads"
geometry_fieldname = "geom"
id_fieldname = "osm_id"
geometry_type = "linestring"
sql = """
SELECT osm_id, highway,
       ST_AsMVTGeom(
           COALESCE(
             CASE WHEN !ZOOM! < 15 THEN ST_Simplify(ST_CollectionExtract((way),2),20)
                  ELSE ST_CollectionExtract((way),2)
             END, (way)
           ), !BBOX!
       ) AS geom
FROM planet_osm_line
WHERE highway IN ('track','footway','path','cycleway','bridleway','steps','alley','service','living_street','pedestrian')
  AND NOT ST_IsEmpty(way)
  AND way && !BBOX!

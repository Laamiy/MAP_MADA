[[providers.layers]]
name = "landuse"
geometry_fieldname = "geom"
id_fieldname = "osm_id"
geometry_type = "polygon"
sql = """
SELECT osm_id, landuse, "natural", leisure, wetland,
       ST_AsMVTGeom(
           COALESCE(
             CASE
               -- Aggressive simplification at low zooms
               WHEN !ZOOM! < 6  THEN ST_Simplify(ST_CollectionExtract((way),3), 500)
               WHEN !ZOOM! < 9  THEN ST_Simplify(ST_CollectionExtract((way),3), 100)
               WHEN !ZOOM! < 12 THEN ST_Simplify(ST_CollectionExtract((way),3), 10)
               WHEN !ZOOM! < 15 THEN ST_Simplify(ST_CollectionExtract((way),3), 2)
               ELSE ST_CollectionExtract((way),3)
             END, (way)
           ), !BBOX!
       ) AS geom
FROM planet_osm_polygon
WHERE (landuse IS NOT NULL OR "natural" IS NOT NULL OR leisure IS NOT NULL)
  AND NOT ST_IsEmpty(way)
  AND way && !BBOX!
  -- Only show major landuse at low zooms
  AND CASE
    WHEN !ZOOM! < 8 THEN 
      landuse IN ('forest','residential','industrial','commercial') 
      OR "natural" IN ('wood','water','wetland')
    ELSE TRUE
  END
ORDER BY 
  -- Render order: water first, then forest, then developed
  CASE 
    WHEN "natural" = 'water' OR landuse = 'reservoir' THEN 1
    WHEN "natural" = 'wood' OR landuse = 'forest' THEN 2
    WHEN landuse IN ('residential','commercial','industrial') THEN 3
    ELSE 4
  END,
  way_area DESC  -- Larger areas first
LIMIT CASE 
    -- WHEN !ZOOM! <= 6  THEN 100
    -- WHEN !ZOOM! <= 9  THEN 500
    WHEN !ZOOM! <= 12 THEN 2000
    ELSE 10000
END
"""

# -------------------------------------------------
# administrative boundaries  –  zoom-aware + light
# -------------------------------------------------

[[providers.layers]]
name = "boundaries_coarse"
geometry_fieldname = "geom"
id_fieldname = "osm_id"
geometry_type = "polygon"
sql = """
SELECT osm_id, boundary, admin_level, name,
       ST_AsMVTGeom(
           ST_Simplify(ST_CollectionExtract(way, 3), 
             CASE 
               WHEN !ZOOM! < 6 THEN 3000
               WHEN !ZOOM! < 8 THEN 1000
               ELSE 1
             END),
           !BBOX!
       ) AS geom
FROM planet_osm_polygon
WHERE boundary = 'administrative'
  AND admin_level IN ('3','4','5','6')
  AND !ZOOM! BETWEEN 4 AND 20  
  AND NOT ST_IsEmpty(way)
  AND way && !BBOX!
LIMIT CASE 
    WHEN !ZOOM! < 6 THEN 300
    ELSE 1000
END
"""


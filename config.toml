[[providers.layers]]
name = "boundaries"
geometry_fieldname = "geom"
id_fieldname = "osm_id"
geometry_type = "polygon" # can also be linestring
sql = """
SELECT osm_id, boundary, admin_level, name,
       ST_AsMVTGeom(
           COALESCE(
             CASE
               WHEN !ZOOM! < 7  THEN ST_Simplify(ST_CollectionExtract((way),3),3) -- ,2) if linstring
               WHEN !ZOOM! < 10 THEN ST_Simplify(ST_CollectionExtract((way),3),3)
               ELSE ST_CollectionExtract((way),2)
             END, (way)
           ), !BBOX!
       ) AS geom
FROM planet_osm_polygon -- can also be planet_osm_line
WHERE boundary = 'administrative'
  AND !ZOOM! >= 8                       -- << ignore z ≤ 7 completely
  AND (
        ( !ZOOM! BETWEEN 8 AND 10 AND admin_level IN ('2','3','4') )
     OR ( !ZOOM! >= 11 AND admin_level = '6' )
      )
  AND NOT ST_IsEmpty(way)
  AND way && !BBOX!
  ORDER BY admin_level, osm_id           
  LIMIT CASE
        WHEN !ZOOM! <= 8  THEN 50      
        WHEN !ZOOM! <= 10 THEN 500
        ELSE 50000
      END
"""

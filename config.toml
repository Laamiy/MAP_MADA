[[providers.layers]]
name               = "fokontany"
geometry_fieldname = "geom"
id_fieldname       = "gid"
geometry_type      = "polygon"
sql = """
SELECT gid,
       fokontany AS name,
       p_code    AS code,
       ST_AsMVTGeom(geom, !BBOX!) AS geom
FROM fokontany
WHERE geom && !BBOX!
  AND !ZOOM! >= 8
"""

[[providers.layers]]
name               = "fokontany_labels"
geometry_fieldname = "geom"
id_fieldname       = "gid"
geometry_type      = "point"
sql = """
SELECT gid,
       fokontany AS name,
       ST_AsMVTGeom(ST_Centroid(geom), !BBOX!) AS geom
FROM fokontany
WHERE geom && !BBOX!
  AND !ZOOM! >= 8
"""
#----------------------------------------------
[[providers.layers]]
name        = "esa_vegetation_raw"
geometry_fieldname = "geom_3857"
id_fieldname = "ogc_fid"
geometry_type = "polygon"
sql = """
SELECT ogc_fid,
       CASE landcover
         WHEN 10 THEN 'forest'
         WHEN 20 THEN 'shrubland'
         WHEN 30 THEN 'grassland'
         WHEN 95 THEN 'mangroves'
       END AS veg_type,
       ST_AsMVTGeom(geom_3857, !BBOX!) AS geom_3857
FROM   esa_landcover_raw
WHERE  geom_3857 && !BBOX!
  AND  landcover IN (10,20,30,95)
--LIMIT 1000
"""
#-----------------------------------------------
[[providers.layers]]
name = "esa_vegetation_100m"
geometry_fieldname = "geom"  # This is 'geom' because we created it with ST_Subdivide
id_fieldname = "landcover"   # We didn't keep a unique ID in the optimization step, which is fine for MVT
geometry_type = "polygon"
sql = """
SELECT landcover,
           CASE landcover
             WHEN 10 THEN 'forest'
             WHEN 20 THEN 'shrubland'
             WHEN 30 THEN 'grassland'
             WHEN 40 THEN 'cropland'
             WHEN 50 THEN 'built_up'
             WHEN 60 THEN 'bare_vegetation'
             WHEN 80 THEN 'water'
             WHEN 90 THEN 'wetland'
             WHEN 95 THEN 'mangroves'
             ELSE 'other'
           END AS veg_type,
           ST_AsMVTGeom(
               ST_Transform(geom, 3857), 
               !BBOX!
           ) AS geom
    FROM esa_veg_150m_fast
    WHERE geom && ST_Transform(!BBOX!, 4326)
"""
#-----------------------------------------------
[[providers.layers]]
name = "esa_vegetation_30m"
geometry_fieldname = "geom"
id_fieldname = "landcover"
geometry_type = "polygon"
sql = """
    SELECT landcover,
           CASE landcover
             WHEN 10 THEN 'tree_cover'
             WHEN 20 THEN 'shrubland'
             WHEN 30 THEN 'grassland'
             WHEN 40 THEN 'cropland'
             WHEN 50 THEN 'built_up'
             WHEN 60 THEN 'bare_vegetation'
             WHEN 80 THEN 'water'
             WHEN 90 THEN 'wetland'
             WHEN 95 THEN 'mangroves'
             ELSE 'other'
           END AS veg_type,
           ST_AsMVTGeom(
               ST_Simplify(
                   ST_Transform(geom, 3857),
                   CASE
                       WHEN !ZOOM! <= 15 THEN 0.5 -- Aggressive simplification for z15 and below
                       WHEN !ZOOM! = 16 THEN 0.1
                       WHEN !ZOOM! = 17 THEN 0.09
                       ELSE 0.07 -- Minimal simplification at highest zoom
                   END
               ),
               !BBOX!
           ) AS geom
    FROM esa_veg_30m_fast
    WHERE geom && ST_Transform(!BBOX!, 4326)
    AND ST_Area(geom::geography) > CASE
        WHEN !ZOOM! <= 12 THEN 100 -- Filter features smaller than 10,000 m² at mid-zoom
        ELSE 10                    -- Allow features down to 1,000 m² at high zoom
    END
"""#-----------------------------------------------
#-------------------------------------------------
#  Structures – bridges, stairs, man-made lines
#-------------------------------------------------
[[providers.layers]]
name               = "structures"
geometry_fieldname = "geom"
id_fieldname       = "osm_id"
geometry_type      = "linestring"
sql = """
SELECT osm_id,
       name,
       COALESCE(highway, man_made)        AS kind,          -- 'primary', 'steps', 'pylon', 'breakwater' …
       CASE
         WHEN bridge IS NOT NULL          THEN 'bridge'
         WHEN highway  = 'steps'          THEN 'stairs'
         WHEN man_made IS NOT NULL        THEN 'man_made'
         ELSE 'other'
       END                                AS structure_type, -- handy for quick filtering
       bridge,
       man_made,
       highway,
       ST_AsMVTGeom(
           COALESCE(
             CASE
               WHEN !ZOOM! < 12 THEN ST_Simplify(ST_CollectionExtract(way,2), 10)
               WHEN !ZOOM! < 15 THEN ST_Simplify(ST_CollectionExtract(way,2), 2)
               ELSE                  ST_CollectionExtract(way,2)
             END,
             way
           ), !BBOX!
       ) AS geom
FROM planet_osm_line
WHERE (bridge IS NOT NULL
       OR highway = 'steps'
       OR man_made IS NOT NULL)
  AND NOT ST_IsEmpty(way)
  AND way && !BBOX!
LIMIT CASE
    WHEN !ZOOM! <= 10 THEN 400
    WHEN !ZOOM! <= 14 THEN 2000
    ELSE 1000000
END
"""


"""



[[providers.layers]]
name        = "roads_low"
geometry_fieldname = "geom"
id_fieldname       = "osm_id"
geometry_type      = "linestring"

sql = """
(
/* ---- Antananarivo bbox (EPSG:3857) - CORRECTED COORDINATES ---- */
WITH tana AS (
                SELECT ST_MakeEnvelope(5283000, -2149000,  -- southwest corner
                         5296000, -2128000,   -- northeast corner
                         3857) AS env
)
SELECT
  osm_id,
  name,
  highway,
  ref,
  ST_AsMVTGeom(
    CASE
      WHEN !ZOOM! < 6  THEN ST_Simplify(ST_CollectionExtract(way,2), 500)
      WHEN !ZOOM! < 9  THEN ST_Simplify(ST_CollectionExtract(way,2), 100)
      WHEN !ZOOM! < 12 THEN ST_Simplify(ST_CollectionExtract(way,2), 10)
      ELSE                  ST_Simplify(ST_CollectionExtract(way,2), 0.01)
    END,
    !BBOX!
  ) AS geom
FROM planet_osm_roads, tana
WHERE highway IS NOT NULL
  AND way && !BBOX!
  AND (
    /* OUTSIDE TANA: show all roads at all zooms */
    (NOT ST_Intersects(way, tana.env))
    
    OR
    
    /* INSIDE TANA: hide everything below zoom 12 */
    (
      ST_Intersects(way, tana.env)
      AND !ZOOM! >= 11
    )
  )
)
"""

